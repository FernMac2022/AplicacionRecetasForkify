            </li>
            <li class=nav__item>
              <button class="nav__btn nav__btn--bookmarks">
                <svg class=nav__icon><use href=/icons.c5b0f01c.svg#icon-bookmark /></svg>
                <span>Bookmarks</span>
              </button>
              <div class=bookmarks>
                <ul class=bookmarks__list>
                  <li>
                    <div class=message>
                      <div>
                        <svg><use href=/icons.c5b0f01c.svg#icon-smile /></svg>
                      </div>
                      <p>
                        No bookmarks yet. Find a nice recipe and bookmark it :)
                      </p>
                    </div>
                  </li>

                  
                </ul>
              </div>
            </li>
          </ul>
        </nav>
      </header>

      <div class=search-results>
        <ul class=results>
          
        </ul>

        <div class=pagination>
          
        </div>

        <p class=copyright>
          © Copyright by
          <a class=twitter-link target=_blank rel=noopener href=https://twitter.com/jonasschmedtman>Jonas Schmedtmann</a>. Use for learning or your portfolio. Don't claim
          as your own.
        </p>
      </div>

      <div class=recipe>
        <div class=message>
          <div>
            <svg><use href=/icons.c5b0f01c.svg#icon-smile /></svg>
          </div>
          <p>Start by searching for a recipe or an ingredient. Have fun!</p>

    <div class="hidden overlay"></div>
    <div class="add-recipe-window hidden">
      <button class=btn--close-modal>×</button>
      <form class=upload>
        <div class=upload__column>
          <h3 class=upload__heading>Recipe data</h3>
          <label for=title>Title</label>
          <input id=title value=TEST required name=title placeholder="Enter recipe title">
          <label for=sourceUrl>URL</label>
          <input id=sourceUrl value=TEST required name=sourceUrl placeholder="Enter recipe URL">
          <label for=image>Image URL</label>
          <input id=image value=TEST required name=image placeholder="Enter image URL">
          <label for=publisher>Publisher</label>
          <input id=publisher value=TEST required name=publisher placeholder="Enter publisher name">
          <label for=cookingTime>Prep time</label>
          <input id=cookingTime value=23 required name=cookingTime type=number placeholder="Enter prep time in minutes">
          <label for=servings>Servings</label>
          <input id=servings value=23 required name=servings type=number placeholder="Enter servings">
        </div>

        <div class=upload__column>
          <h3 class=upload__heading>Ingredients</h3>
          <label for=ingredient-1>Ingredient 1</label>
          <input id=ingredient-1 value=0.5,kg,Rice required name=ingredient-1 placeholder="Format: 'Quantity,Unit,Description'">
          <label for=ingredient-2>Ingredient 2</label>
          <input id=ingredient-2 value=1,,Avocado name=ingredient-2 placeholder="Format: 'Quantity,Unit,Description'">
          <label for=ingredient-3>Ingredient 3</label>
          <input id=ingredient-3 value=,,salt name=ingredient-3 placeholder="Format: 'Quantity,Unit,Description'">
          <label for=ingredient-4>Ingredient 4</label>
          <input id=ingredient-4 name=ingredient-4 placeholder="Format: 'Quantity,Unit,Description'">
          <label for=ingredient-5>Ingredient 5</label>

          <label for=ingredient-6>Ingredient 6</label>
